<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웨더핏 에이전트</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --ink:#1f2933; --sub:#616e7c; --line:#e4e7eb; --accent:#2563eb; --must:#b45309; --must-bg:#fef3c7; --err:#b91c1c; --err-bg:#fee2e2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1 { font-size:18px; margin:0; }
  header .sub { font-size:12px; color:var(--sub); }
  main { max-width:760px; margin:0 auto; padding:20px 16px 40px; }
  /* 위치·날짜·날씨 상자 (시안 04) */
  .context { background:var(--card); border:1px solid #bfdbfe; border-radius:16px; padding:14px; margin-bottom:14px; box-shadow:0 4px 14px rgba(37,99,235,.08); }
  .now { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding-bottom:12px; border-bottom:1px dashed var(--line); }
  .now .clock { font-size:15px; font-weight:800; }
  .now .clock small { font-size:12px; font-weight:600; color:var(--sub); margin-left:6px; }
  .live { font-size:11px; font-weight:700; color:#047857; background:#d1fae5; border-radius:999px; padding:3px 9px; }
  .live::before { content:"●"; margin-right:4px; animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .loc { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding-top:12px; }
  .loc .pin { font-size:22px; }
  .loc .where { flex:1; min-width:180px; }
  .loc .where b { font-size:18px; }
  .loc .where .src { display:block; font-size:12px; color:var(--sub); margin-top:2px; }
  .btn { font-size:13px; padding:7px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); cursor:pointer; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .picker { gap:6px; flex-wrap:wrap; align-items:center; margin-top:10px; padding:8px 10px; background:#eff6ff; border-radius:10px; display:flex; }
  .picker select { flex:0 1 170px; min-width:120px; padding:5px 8px; border:1px solid #bfdbfe; border-radius:8px; font-size:13px; background:#fff; }
  .denied { margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--err-bg); color:var(--err); font-size:13px; }
  .days { display:flex; gap:6px; margin-top:10px; }
  .days button { flex:0 1 auto; padding:5px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card); cursor:pointer; font-size:12px; color:var(--ink); }
  .days button b { display:inline; font-size:13px; margin-right:4px; }
  .days button.on { border-color:var(--accent); background:#eff6ff; color:var(--accent); font-weight:700; }
  .today { display:flex; gap:12px; align-items:center; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .today .icon { font-size:36px; }
  .today .meta { flex:1; min-width:0; }
  .today .chips span { margin-top:0; margin-bottom:4px; }
  .today .stamp { font-size:11px; color:var(--sub); }
  .today.err { color:var(--err); font-size:13px; }

  /* 질문 상자 (강조) */
  .askbox { padding:16px; border-radius:18px; background:linear-gradient(135deg,#dbeafe,#eff6ff); border:2px solid var(--accent); box-shadow:0 8px 24px rgba(37,99,235,.18); }
  .askbox .q-label { display:block; font-size:15px; font-weight:800; color:#1e3a8a; margin:0 0 10px 2px; }
  .ask { display:flex; gap:8px; }
  .ask input { flex:1; min-width:0; padding:15px 16px; border:2px solid #93c5fd; border-radius:12px; font-size:17px; font-weight:600; background:#fff; }
  .ask input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(37,99,235,.2); }
  .ask button { padding:15px 22px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:17px; font-weight:800; white-space:nowrap; cursor:pointer; box-shadow:0 4px 12px rgba(37,99,235,.35); }
  .ask button:hover { background:#1d4ed8; }
  .ask button:disabled { opacity:.5; cursor:wait; }
  .hint { font-size:12px; color:var(--sub); margin:6px 2px 10px; }
  .samples { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:18px; }
  .samples .label { font-size:12px; font-weight:700; color:var(--sub); margin-right:2px; }
  .samples button { font-size:12px; padding:5px 10px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); cursor:pointer; }
  .samples button:hover { border-color:var(--accent); color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
  .weathers { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-bottom:14px; }
  .weather { display:flex; gap:14px; align-items:center; margin:0; }
  .weather .icon { font-size:40px; }
  .weather .meta b { font-size:16px; }
  .weather.err { background:var(--err-bg); border-color:#fecaca; color:var(--err); font-size:14px; }
  .chips span { display:inline-block; background:var(--bg); border-radius:999px; padding:3px 9px; font-size:12px; margin:4px 5px 0 0; }
  h2 { font-size:15px; margin:0 0 10px; }
  .answer { line-height:1.75; font-size:14px; }
  .answer h3, .answer h4 { font-size:15px; margin:14px 0 6px; }
  .answer ul { margin:4px 0; padding-left:18px; }
  .answer hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
  .answer p { margin:6px 0; }
  .must { background:var(--must-bg); color:var(--must); border-radius:10px; padding:12px 14px; font-weight:700; margin-bottom:14px; }
  .looks { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
  .item { border:1px solid var(--line); border-radius:12px; padding:12px 10px; text-align:center; background:linear-gradient(180deg,#f8fafc,#fff); position:relative; }
  .item .pic { font-size:38px; line-height:1.2; }
  .item .name { font-size:13px; font-weight:700; margin-top:6px; }
  .item .why { font-size:11px; color:var(--sub); margin-top:3px; }
  .item.req { border-color:#f59e0b; background:linear-gradient(180deg,#fffbeb,#fff); }
  .item.req::after { content:"필수"; position:absolute; top:6px; right:6px; font-size:10px; font-weight:700; color:#fff; background:var(--must); border-radius:999px; padding:1px 6px; }
  .hero { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:14px; padding:16px 18px; border-radius:18px; color:#fff;
          background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 55%,#60a5fa 100%); box-shadow:0 10px 28px rgba(37,99,235,.28); }
  .hero .stack { display:grid; grid-template-columns:repeat(2,1fr); gap:2px 6px; font-size:32px; line-height:1.15; text-align:center; padding:8px 10px; border-radius:14px; background:rgba(255,255,255,.16); }
  .hero .body { flex:1; min-width:200px; }
  .hero .badge { display:inline-block; font-size:12px; font-weight:700; background:#fbbf24; color:#78350f; border-radius:999px; padding:3px 10px; }
  .hero h2 { font-size:20px; margin:6px 0 4px; color:#fff; }
  .hero p { margin:0; font-size:14px; line-height:1.55; color:#e0e7ff; }
  .hero .tags span { display:inline-block; font-size:12px; background:rgba(255,255,255,.18); border-radius:999px; padding:3px 10px; margin:6px 6px 0 0; }
  .ctx { font-size:13px; color:var(--sub); }
  .ctx div { margin:4px 0; }
  code { background:var(--bg); padding:1px 6px; border-radius:4px; font-size:12px; color:var(--ink); }
  details summary { cursor:pointer; font-size:14px; font-weight:700; }
  .steps { margin-top:10px; font-size:12px; }
  .step { border-top:1px solid var(--line); padding:8px 0; }
  .step pre { margin:4px 0 0; white-space:pre-wrap; word-break:break-all; background:var(--bg); padding:8px; border-radius:8px; max-height:220px; overflow:auto; }
  .status { font-size:14px; color:var(--sub); padding:10px 2px; }
  .error { background:var(--err-bg); color:var(--err); border-radius:10px; padding:12px 14px; font-size:14px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>☔ 웨더핏 에이전트</h1>
  <span class="sub">출근 옷차림 도우미 · 실시간 날씨</span>
</header>
<main>
  <!-- 위치·날짜·날씨 (시안 04) -->
  <section class="context" aria-label="현재 위치와 날씨">
    <div class="now">
      <div class="clock" id="clock">&nbsp;</div>
      <span class="live">실시간</span>
    </div>
    <div class="loc">
      <span class="pin">📍</span>
      <div class="where">
        <b id="place">현재 위치를 찾는 중…</b>
        <span class="src" id="placeSrc">브라우저가 위치 사용을 물으면 '허용'을 눌러 주세요</span>
      </div>
      <button class="btn" id="relocate" type="button">⟳ 현재 위치</button>
      <button class="btn primary" id="change" type="button">지역 변경</button>
    </div>
    <div class="picker" id="picker" hidden>
      <select id="sido" aria-label="시/도"></select>
      <select id="sigungu" aria-label="시/군/구"></select>
    </div>
    <div class="denied" id="denied" hidden></div>
    <div class="days" id="days" aria-label="날짜 선택"></div>
    <div class="today" id="today"><div class="meta"><div class="stamp">지역을 고르면 날씨가 나옵니다</div></div></div>
  </section>

  <!-- 질문 (날씨 아래) -->
  <div class="askbox">
    <label class="q-label" for="q">👕 오늘 뭐 입을지 물어보세요</label>
    <form class="ask" id="ask">
      <input id="q" autocomplete="off" value="출근하는데 뭐 입을까? 추위를 좀 타요">
      <button id="go" type="submit">물어보기 →</button>
    </form>
  </div>
  <p class="hint">질문에 지역이나 날짜를 쓰지 않아도 위에서 고른 <b id="hintPlace">지역</b> · <b id="hintDay">오늘</b> 기준으로 답합니다. 질문에 다른 지역·날짜를 쓰면 그쪽이 우선합니다.</p>
  <div class="samples" id="samples"></div>

  <div id="status" class="status" hidden></div>
  <div id="error" class="error" hidden></div>

  <div id="result" hidden>
    <div class="weathers" id="weathers"></div>
    <section class="hero" id="hero" hidden>
      <div class="stack" id="stack"></div>
      <div class="body">
        <span class="badge">✨ 오늘의 코디</span>
        <h2 id="title"></h2>
        <p id="desc"></p>
        <div class="tags" id="tags"></div>
      </div>
    </section>
    <section class="card">
      <h2>답변</h2>
      <div class="answer" id="answer"></div>
    </section>
    <section class="card" id="itemsCard" hidden>
      <h2>추천 아이템</h2>
      <div class="looks" id="items"></div>
    </section>
    <div class="must" id="must" hidden></div>
    <section class="card ctx" id="ctxCard" hidden>
      <h2>근거 문서</h2>
      <div id="ctx"></div>
    </section>
    <section class="card">
      <details>
        <summary>trace (처리 단계 <span id="stepCount"></span>개)</summary>
        <div class="steps" id="steps"></div>
      </details>
    </section>
  </div>
</main>
<script src="/regions.js"></script>
<script>
  // 케이스별 예시 5개: 기본(고른 지역) / 여러 날 / 다른 지역 / 시간대 질문 / 필수품 제거 요청
  const SAMPLES = [
    "출근하는데 뭐 입을까? 추위를 좀 타요",
    "오늘부터 모레까지 출근 옷차림 알려줘",
    "내일 해운대 출근 옷차림 알려줘",
    "오후 6시 퇴근할 때 몇 도야?",
    "우산은 짐이니까 빼고 알려줘",
  ];
  const ICONS = { "비": "🌧️", "눈": "❄️", "진눈깨비": "🌨️", "맑음": "☀️", "흐림": "☁️", "구름많음": "⛅",
                  "구름조금": "🌤️", "안개": "🌫️", "이슬비": "🌦️", "소나기": "🌦️", "뇌우": "⛈️" };
  const DAY_LABELS = ["오늘", "내일", "모레"];
  const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
  // 화면 상태: 지역 목록, 서버 기준 오늘, 고른 날짜·지역 (정확한 좌표는 저장하지 않는다)
  const state = { regions: null, today: null, dayIndex: 0, sido: null, sigungu: null };
  const REQUIRED_PREFIX = "☂ 필수 준비물:";
  const $ = (id) => document.getElementById(id);

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // 답변용 간단 마크다운: 제목, 굵게, 목록, 구분선만 처리 (HTML은 먼저 이스케이프)
  function md(text) {
    const out = [];
    let inList = false;
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      const bullet = line.match(/^[-*•]\s+(.*)$/) || line.match(/^\d+\.\s+(.*)$/);
      if (bullet) {
        if (!inList) { out.push("<ul>"); inList = true; }
        out.push(`<li>${inline(bullet[1])}</li>`);
        continue;
      }
      if (inList) { out.push("</ul>"); inList = false; }
      if (!line) continue;
      if (/^-{3,}$/.test(line)) out.push("<hr>");
      else if (/^#{1,6}\s/.test(line)) out.push(`<h3>${inline(line.replace(/^#{1,6}\s+/, ""))}</h3>`);
      else out.push(`<p>${inline(line)}</p>`);
    }
    if (inList) out.push("</ul>");
    return out.join("");
  }

  function renderWeather(trace) {
    const feels = trace.filter((s) => s.step === "tool:calc_feels_like").map((s) => s.output);
    // 위 날씨 상자와 같은 지역·날짜의 결과는 다시 보여 주지 않는다 (질문에 다른 지역·날짜를 쓴 경우만 카드로 보임)
    const shown = { region: placeName(), date: dayIso(state.dayIndex) };
    const cards = trace.filter((s) => s.step === "tool:get_weather")
      .filter(({ output: w }) => w.error || w.city !== shown.region || w.date !== shown.date).map(({ output: w }) => {
      if (w.error) {
        const extra = w.supported_cities ? `지원 도시: ${w.supported_cities.join("·")}` : (w.message || `가능한 날짜: ${(w.available_dates || []).join(", ")}`);
        return `<section class="card weather err"><div>⚠️ ${esc(w.city || w.region || w.date || "")}<br>${esc(extra)}</div></section>`;
      }
      const f = feels.find((x) => x.temp === w.temp_min && x.wind_speed === w.wind_speed);
      const feelsLike = f ? f.feels_like : w.feels_like;
      return `<section class="card weather">
        <div class="icon">${ICONS[w.condition] || "🌡️"}</div>
        <div class="meta"><div><b>${esc(w.city)} · ${esc(w.date_label || w.date)}</b></div>
        <div class="chips"><span>${esc(w.condition)} · 강수확률 ${w.precip_prob}%</span><span>최저 ${w.temp_min}℃ / 최고 ${w.temp_max}℃</span>
        ${feelsLike !== undefined ? `<span>체감 최저 ${feelsLike}℃</span>` : ""}<span>바람 ${w.wind_speed}m/s</span></div></div></section>`;
    });
    $("weathers").innerHTML = cards.join("");
  }

  function render(data) {
    const lines = data.answer.split("\n");
    const mustLine = lines.filter((l) => l.trim().startsWith(REQUIRED_PREFIX)).pop();
    const body = lines.filter((l) => !l.trim().startsWith(REQUIRED_PREFIX)).join("\n");

    renderWeather(data.trace || []);

    const s = data.outfit_summary;
    $("hero").hidden = !s;
    if (s) {
      $("title").textContent = s.title;
      $("desc").textContent = s.description;
      $("tags").innerHTML = (s.tags || []).map((t) => `<span>${esc(t)}</span>`).join("");
      $("stack").innerHTML = (data.items || []).filter((i) => !i.required).slice(0, 4).map((i) => `<span>${esc(i.icon || "👕")}</span>`).join("") || "<span>👕</span>";
    }

    $("answer").innerHTML = md(body);

    const items = data.items || [];
    $("itemsCard").hidden = !items.length;
    $("items").innerHTML = items.map((i) => `<div class="item ${i.required ? "req" : ""}">
      <div class="pic">${esc(i.icon || "👕")}</div><div class="name">${esc(i.name)}</div><div class="why">${esc(i.reason)}</div></div>`).join("");

    $("must").hidden = !mustLine;
    $("must").textContent = mustLine ? mustLine.trim() : "";

    const ctx = data.contexts || [];
    $("ctxCard").hidden = !ctx.length;
    $("ctx").innerHTML = ctx.map((c) => `<div>· <code>${esc(c.doc_id)}</code> ${esc(c.text.replace(/\s+/g, " ").slice(0, 110))}…</div>`).join("");

    const steps = data.trace || [];
    $("stepCount").textContent = steps.length;
    $("steps").innerHTML = steps.map((st) => `<div class="step"><code>${esc(st.step)}</code>
      <pre>${esc(JSON.stringify({ input: st.input, output: st.output }, null, 1))}</pre></div>`).join("");

    $("result").hidden = false;
  }

  async function ask(question) {
    $("go").disabled = true;
    $("error").hidden = true;
    $("result").hidden = true;
    $("status").hidden = false;
    const started = Date.now();
    $("status").textContent = "답변을 만드는 중입니다… (날씨 조회 → 문서 검색 → 코디 정리, 보통 10~40초)";
    try {
      // 고른 위치는 시/도·시·군·구 이름만 보낸다 (좌표는 보내지 않는다)
      const body = { question, date: DAY_LABELS[state.dayIndex] };
      if (state.sido) body.location = { sido: state.sido, sigungu: state.sigungu };
      const res = await fetch("/query", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (!res.ok) throw new Error(`서버 오류 ${res.status}: ${(await res.text()).slice(0, 300)}`);
      render(await res.json());
      $("status").textContent = `완료 · ${((Date.now() - started) / 1000).toFixed(1)}초`;
    } catch (e) {
      $("status").hidden = true;
      $("error").hidden = false;
      $("error").textContent = `요청 실패: ${e.message}`;
    } finally {
      $("go").disabled = false;
    }
  }

  $("samples").innerHTML = `<span class="label">예시</span>` +
    SAMPLES.map((q, i) => `<button type="button" data-i="${i}">${esc(q.length > 22 ? q.slice(0, 22) + "…" : q)}</button>`).join("");
  $("samples").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    $("q").value = SAMPLES[b.dataset.i];
    ask($("q").value);
  });
  $("ask").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = $("q").value.trim();
    if (q) ask(q);
  });

  // ---------------------------------------------------------------- 위치·날짜·날씨 (시안 04)

  function placeName() {
    return state.sido ? (state.sigungu ? `${state.sido} ${state.sigungu}` : state.sido) : null;
  }

  // 서버가 알려 준 오늘(한국 시간)에서 i일 뒤 날짜. PC 시계는 쓰지 않는다.
  function dayDate(i) {
    const [y, m, d] = state.today.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d + i));
  }
  function dayIso(i) {
    return state.today ? dayDate(i).toISOString().slice(0, 10) : null;
  }

  // 현재 시각 표시 (화면 표시용으로만 PC 시계를 쓴다)
  function tick() {
    const d = new Date();
    const h = d.getHours(), m = String(d.getMinutes()).padStart(2, "0"), s = String(d.getSeconds()).padStart(2, "0");
    $("clock").innerHTML = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일(${WEEK[d.getDay()]}) ` +
      `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}:${m}:${s}<small>지금 기준</small>`;
  }

  function renderDays() {
    $("days").innerHTML = DAY_LABELS.map((label, i) => {
      const d = dayDate(i);
      return `<button type="button" class="${i === state.dayIndex ? "on" : ""}" data-i="${i}"><b>${label}</b>` +
        `<span>${d.getUTCMonth() + 1}/${d.getUTCDate()}(${WEEK[d.getUTCDay()]})</span></button>`;
    }).join("");
    $("hintDay").textContent = DAY_LABELS[state.dayIndex];
  }

  function fillSido() {
    $("sido").innerHTML = `<option value="">시/도 선택</option>` +
      state.regions.sido.map((s) => `<option${s.name === state.sido ? " selected" : ""}>${esc(s.name)}</option>`).join("");
    fillSigungu();
  }
  function fillSigungu() {
    const sido = state.regions.sido.find((s) => s.name === $("sido").value);
    $("sigungu").innerHTML = `<option value="">시·군·구 선택</option>` + (sido ? sido.sigungu.map((g) =>
      `<option${g.name === state.sigungu ? " selected" : ""}>${esc(g.name)}</option>`).join("") : "");
  }

  function setPlace(sido, sigungu, source) {
    state.sido = sido;
    state.sigungu = sigungu;
    $("place").textContent = placeName();
    $("hintPlace").textContent = placeName();
    $("placeSrc").textContent = source;
    $("denied").hidden = true;
    fillSido();
    loadWeather();
  }

  function askToPick(message) {
    state.sido = state.sigungu = null;
    $("place").textContent = "지역을 골라 주세요";
    $("hintPlace").textContent = "지역";
    $("placeSrc").textContent = "현재 위치를 쓸 수 없어요";
    $("denied").textContent = message;
    $("denied").hidden = false;
    $("picker").hidden = false;
    fillSido();
    $("today").className = "today";
    $("today").innerHTML = `<div class="meta"><div class="stamp">지역을 고르면 날씨가 나옵니다</div></div>`;
  }

  // 브라우저 위치 → 가장 가까운 시·군·구 (좌표는 이 계산에만 쓰고 저장·전송하지 않는다)
  function locate() {
    $("placeSrc").textContent = "현재 위치를 찾는 중…";
    if (!navigator.geolocation) return askToPick("이 브라우저는 위치 찾기를 지원하지 않아요. '지역 변경'에서 직접 골라 주세요.");
    navigator.geolocation.getCurrentPosition((pos) => {
      const near = WeatherFitRegions.nearestRegion(state.regions, pos.coords.latitude, pos.coords.longitude);
      if (!near) return askToPick("가까운 지역을 찾지 못했어요. 직접 골라 주세요.");
      setPlace(near.sido, near.sigungu, `현재 위치에서 자동으로 찾았어요 · 대표 위치까지 약 ${near.distanceKm}km`);
    }, () => askToPick("위치 권한이 꺼져 있어 현재 위치를 찾지 못했어요. '지역 변경'에서 시/도와 시·군·구를 직접 골라 주세요."),
    { timeout: 10000, maximumAge: 10 * 60 * 1000 });
  }

  async function loadWeather() {
    if (!state.sido) return;
    const box = $("today");
    box.className = "today";
    box.innerHTML = `<div class="meta"><div class="stamp">날씨를 불러오는 중…</div></div>`;
    const params = new URLSearchParams({ sido: state.sido, date: DAY_LABELS[state.dayIndex] });
    if (state.sigungu) params.set("sigungu", state.sigungu);
    try {
      const w = await (await fetch(`/weather?${params}`)).json();
      if (w.error) {
        box.className = "today err";
        box.innerHTML = `<div class="meta">⚠️ ${esc(w.message || "날씨를 불러오지 못했어요.")}</div>`;
        return;
      }
      const t = new Date();
      box.innerHTML = `<div class="icon">${ICONS[w.condition] || "🌡️"}</div><div class="meta"><div class="chips">
        <span>${esc(w.condition)} · 강수확률 ${w.precip_prob}%</span><span>최저 ${w.temp_min}℃ / 최고 ${w.temp_max}℃</span>
        ${w.feels_like !== undefined ? `<span>체감 최저 ${w.feels_like}℃</span>` : ""}<span>바람 ${w.wind_speed}m/s</span>
        ${(w.required_items || []).length ? `<span>☂ 필수: ${esc(w.required_items.join(", "))}</span>` : ""}</div>
        <div class="stamp">${esc(w.source || "데모 데이터")} · ${esc(w.date_label)} · ${t.getHours()}:${String(t.getMinutes()).padStart(2, "0")} 조회</div></div>`;
    } catch (e) {
      box.className = "today err";
      box.innerHTML = `<div class="meta">⚠️ 날씨를 불러오지 못했어요: ${esc(e.message)}</div>`;
    }
  }

  $("days").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    state.dayIndex = Number(b.dataset.i);
    renderDays();
    loadWeather();
  });
  $("change").addEventListener("click", () => { $("picker").hidden = !$("picker").hidden; });
  $("relocate").addEventListener("click", locate);
  $("sido").addEventListener("change", () => {
    state.sigungu = null;
    fillSigungu();
    const sido = state.regions.sido.find((s) => s.name === $("sido").value);
    if (sido && !sido.sigungu.length) setPlace(sido.name, null, "직접 선택한 지역이에요");
  });
  $("sigungu").addEventListener("change", () => {
    if ($("sido").value && $("sigungu").value) setPlace($("sido").value, $("sigungu").value, "직접 선택한 지역이에요 · ⟳ 현재 위치로 되돌릴 수 있어요");
  });

  (async function init() {
    tick();
    setInterval(tick, 1000);
    try {
      const data = await (await fetch("/regions")).json();
      state.regions = data;
      state.today = data.today;
    } catch (e) {
      $("placeSrc").textContent = `지역 목록을 불러오지 못했어요: ${e.message}`;
      return;
    }
    renderDays();
    fillSido();
    locate();
  })();
</script>
</body>
</html>
